[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriber"]

[project]
name = "scriber"
version = "0.1.0"
description = "Transcribe and summarize YouTube videos, local media, or existing transcripts."
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [                       # transcription-only base (whisper + ffmpeg + yt-dlp)
    "bs4>=0.0.2",
    "colorama>=0.4.6",
    "ffmpeg-python>=0.2.0",
    "langdetect>=1.0.9",
    "numpy>=2.2.4",
    "openai-whisper>=20240930",
    "pyyaml>=6.0.3",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
    "unidecode>=1.3.8",
    "yt-dlp>=2026.3.17",
]

[project.optional-dependencies]
# Speaker diarization (pyannote is a torch app; needs HUGGINGFACE_TOKEN at runtime).
diarize = [
    "pyannote-audio>=3.3.2",
    "torchaudio>=2.6.0",
]
# LLM summarization backends (OpenAI / OpenRouter / local RAG via langchain+Ollama).
summarize = [
    "chromadb>=1.0.4",
    "langchain>=0.3.23",
    "langchain-chroma>=0.2.5",
    "langchain-community>=0.3.21",
    "langchain-ollama>=0.3.1",
    "openai>=1.67.0",
    "textblob>=0.19.0",
]

# torch is intentionally NOT pinned to a CPU index: scriber stays GPU-capable by
# default. Lean/CPU-only consumers (e.g. BDC OS) select the CPU backend at
# install time via `UV_TORCH_BACKEND=cpu` — see docs/BDCOS_INSTALL.md.

[project.scripts]
scriber = "scriber.main:main"

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]  # pkg_resources was removed from default install in setuptools 81

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: slow tests hitting real ML deps (whisper, pyannote) — run with `pytest -m integration`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"  # 2026-04-22: diverges from Boilerplate (py313) — deps pin Python 3.11.9
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ERA001", "G004", "PIE808", "T201", "TD002", "TD003", "S311",
    "E501",
    "COM812",
    "ISC001",
    "D",
    "CPY",
    "ANN401",
    "FIX",
    "TRY003",
    "PLR0913",
    "PLR2004",
    "TC001", "TC002", "TC003",  # 2026-04-16: allow runtime-visible imports; no perf concern here
    "TC006",  # 2026-04-16: don't force quoted type in cast(); with __future__ annotations it's pointless churn
    "EM101", "EM102",  # 2026-04-16: inline exception messages are fine; no mandatory variable-first pattern
    "TID252",  # 2026-04-16: relative imports (from .base, from ..models) are idiomatic intra-package
    "C901", "PLR0911", "PLR0912", "PLR0915",  # 2026-04-16: complexity metrics are opinion, not bug (same family as PLR0913)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "SLF001", "ARG", "ANN", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"  # 2026-04-22: diverges from Boilerplate (3.13) — deps pin Python 3.11.9
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv", "build", "dist"]
extraPaths = ["src"]  # mirror pytest pythonpath so `from scriber.*` resolves in both src/ and tests/
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingTypeArgument = "error"
reportCallIssue = "error"
reportArgumentType = "error"
reportAssignmentType = "error"
reportReturnType = "error"
reportAttributeAccessIssue = "error"
reportGeneralTypeIssues = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnusedExpression = "error"
reportImplicitOverride = false
reportMissingSuperCall = false
reportIncompatibleVariableOverride = false
reportMissingTypeStubs = false  # 2026-04-22: ML ecosystem (whisper, pyannote, torchaudio, ffmpeg, textblob, langchain) ships no stubs

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"  # 2026-04-22: tests cover private helpers (_load_dotenv, _excepthook, _sanitize_filename); mirrors ruff's SLF001 ignore for tests/

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3.7",
]
